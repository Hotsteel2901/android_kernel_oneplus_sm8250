name: Build KSU-Next + SUSFS kernel

# Builds the OnePlus 8 (sm8250 / kona) kernel with KernelSU-Next (manual-hook
# mode) and SUSFS 2.1.0, then packages an AnyKernel3 flashable zip.
#
# The stock OnePlus kernel tree references OPLUS vendor modules via dangling
# symlinks (vendor/oplus/kernel/*, vendor/qcom/proprietary/*, ...). We resolve
# them by fetching the official OnePlus open-source modules + devicetree repo
# (OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250) on the
# matching oneplus/sm8250_t_13.1_op8 branch and placing its vendor/ directory
# at the kernel tree root. All 86 dangling symlinks then resolve to real files.

on:
  push:
    branches: [ oneplus/sm8250_t_13.1_op8 ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'fs/susfs.c'
      - 'fs/read_write.c'
      - 'KernelSU-Next/**'
      - 'drivers/kernelsu'
      - 'Dists_ak3/**'
      - 'arch/arm64/configs/vendor/kona*'
      - 'drivers/Kconfig'
      - 'drivers/Makefile'
      - 'fs/Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev cpio zip unzip rsync python3 \
            llvm clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fetch OnePlus open-source vendor modules & devicetree
        run: |
          set -e
          # The matching branch mirrors this kernel branch exactly.
          git clone --depth=1 -b oneplus/sm8250_t_13.1_op8 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git \
            /tmp/vendor-modules
          # Place vendor/ at the kernel tree root so all 86 dangling symlinks resolve.
          cp -a /tmp/vendor-modules/vendor ./vendor
          echo "=== verify: dangling symlinks remaining ==="
          if find . -xtype l -not -path './.git/*' | grep -q .; then
            echo "WARNING: still have dangling symlinks:"
            find . -xtype l -not -path './.git/*'
          else
            echo "none — all symlinks resolved"
          fi

      - name: Make gcc-wrapper.py Python3-compatible
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            # Convert Python2 print statements to Python3
            sed -i 's/^\(\s*\)print \(.*\)$/\1print(\2)/' scripts/gcc-wrapper.py
            sed -i '1s|^#!.*python.*|#!/usr/bin/env python3|' scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 kona-perf_defconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang-12 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=clang-12 \
            -j"$(nproc)" 2>&1 | tee build.log | tail -500

      - name: Package AnyKernel3 zip
        run: |
          if   [ -f out/arch/arm64/boot/Image.gz-dtb ]; then cp out/arch/arm64/boot/Image.gz-dtb Dists_ak3/
          elif [ -f out/arch/arm64/boot/Image.gz ];     then cp out/arch/arm64/boot/Image.gz     Dists_ak3/
          elif [ -f out/arch/arm64/boot/Image ];       then cp out/arch/arm64/boot/Image        Dists_ak3/
          else echo "No kernel image found"; exit 1; fi
          cd Dists_ak3 && ./build_zip.sh

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-kona-op8
          path: Dists_ak3/*.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
          if-no-files-found: warn
