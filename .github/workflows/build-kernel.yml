name: Build KSU-Next + SUSFS kernel

# Builds the OnePlus 8 (sm8250 / kona) kernel with KernelSU-Next (manual-hook
# mode) and SUSFS 2.1.0, then packages an AnyKernel3 flashable zip.
#
# The kernel tree symlinks use relative paths like `../../../vendor/oplus/...`
# that all resolve to TWO LEVELS ABOVE the repo root. In the AOSP manifest the
# kernel source sits at <root>/kernel/msm-4.19/ so two-levels-up is <root>/.
# We replicate this by placing vendor/ (from OnePlusOSS modules repo) at
# $GITHUB_WORKSPACE/../../vendor/ so every symlink resolves to a real file.

on:
  push:
    branches: [ oneplus/sm8250_t_13.1_op8 ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'fs/susfs.c'
      - 'fs/read_write.c'
      - 'fs/notify/fdinfo.c'
      - 'fs/notify/inotify/inotify.h'
      - 'KernelSU-Next/**'
      - 'drivers/kernelsu'
      - 'Dists_ak3/**'
      - 'arch/arm64/configs/vendor/kona*'
      - 'drivers/Kconfig'
      - 'drivers/Makefile'
      - 'fs/Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev cpio zip unzip rsync python3 \
            llvm clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fetch OPLUS vendor modules & place at correct relative path
        run: |
          set -e
          # All symlinks resolve to <repo_root>/../../vendor/...
          # (two levels above the repo, matching the AOSP manifest layout
          #  where kernel source is at <root>/kernel/msm-4.19/).
          VENDOR_DIR="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/vendor"
          echo "Placing vendor modules at: $VENDOR_DIR"
          git clone --depth=1 -b oneplus/sm8250_t_13.1_op8 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git \
            /tmp/vendor-modules
          rm -rf "$VENDOR_DIR"
          cp -a /tmp/vendor-modules/vendor "$VENDOR_DIR"
          # The vendor repo ships real directories at
          # vendor/kernel/msm-4.19/techpack/{display,camera,video}/ which
          # conflict with our symlink vendor/kernel/msm-4.19 -> $GITHUB_WORKSPACE
          # (ln -sf silently fails on a non-empty directory).  Move the techpack
          # content aside so the symlink can be created, and so we can point the
          # kernel source tree's techpack/ at them.
          if [ -d "$VENDOR_DIR/kernel/msm-4.19/techpack" ]; then
            mkdir -p "$VENDOR_DIR/techpack-vendor"
            cp -a "$VENDOR_DIR/kernel/msm-4.19/techpack/." "$VENDOR_DIR/techpack-vendor/"
            rm -rf "$VENDOR_DIR/kernel"
          fi
          echo "=== verify: dangling symlinks remaining ==="
          if find . -xtype l -not -path './.git/*' | grep -q .; then
            echo "WARNING: dangling symlinks:"
            find . -xtype l -not -path './.git/*' | head -10
          else
            echo "none — all symlinks resolved"
          fi
          echo "=== verify: sched_assist/Kconfig ==="
          head -3 kernel/sched_assist/Kconfig || echo "MISSING"

      - name: Make gcc-wrapper.py Python3-compatible
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i 's/^\(\s*\)print \(.*\)$/\1print(\2)/' scripts/gcc-wrapper.py
            sed -i '1s|^#!.*python.*|#!/usr/bin/env python3|' scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Expose vendor defconfigs at arch/arm64/configs/
        # kona-perf_defconfig lives in arch/arm64/configs/vendor/ but `make
        # kona-perf_defconfig` only looks in arch/arm64/configs/.  Symlink the
        # vendor defconfigs up one level so the standard defconfig target finds
        # them, mirroring what the OnePlus build script does internally.
        run: |
          cd arch/arm64/configs
          for f in vendor/kona*_defconfig; do
            [ -f "$f" ] || continue
            ln -sf "$f" "$(basename "$f")"
          done
          ls -la kona*

      - name: Create kernel/msm-4.19 symlinks for vendor module includes
        # OPLUS vendor modules hard-code include paths like
        # "../../../../kernel/msm-4.19/drivers/power/supply/qcom/storm-watch.h"
        # which assume the AOSP manifest layout (<root>/kernel/msm-4.19/ = kernel
        # source).  GCC/Clang resolve symlinks to their REAL path before
        # computing relative include paths, so we need symlinks at the REAL
        # paths (under vendor/) too, not just the symlinked kernel-source paths.
        # We also need techpack/{display,camera,video} symlinks in the source
        # tree pointing to the vendor's techpack content (moved to
        # $VENDOR_DIR/techpack-vendor/ in the previous step).
        run: |
          set -e
          VENDOR_DIR="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/vendor"
          # 1. At repo root (for symlinked-path resolution):
          mkdir -p kernel drivers/kernel
          ln -sfn . kernel/msm-4.19
          ln -sfn ../.. drivers/kernel/msm-4.19
          # 2. At vendor/ (for real-path resolution — GCC follows the oplus
          #    symlink to vendor/oplus/kernel/charger/charger_ic/ then computes
          #    ../../../../  =  vendor/, so needs vendor/kernel/msm-4.19)
          mkdir -p "$VENDOR_DIR/kernel" "$VENDOR_DIR/oplus/kernel"
          ln -sfn "$GITHUB_WORKSPACE" "$VENDOR_DIR/kernel/msm-4.19"
          ln -sfn "$GITHUB_WORKSPACE" "$VENDOR_DIR/oplus/kernel/msm-4.19"
          # 3. techpack symlinks in source tree (kernel Makefiles reference
          #    $(srctree)/techpack/display/msm/dsi etc. for DSI/display headers)
          for tp in display camera video; do
            if [ -d "$VENDOR_DIR/techpack-vendor/$tp" ]; then
              ln -sfn "$VENDOR_DIR/techpack-vendor/$tp" "techpack/$tp"
            fi
          done
          echo "=== verify symlinks ==="
          ls -la kernel/msm-4.19 drivers/kernel/msm-4.19 \
                 "$VENDOR_DIR/kernel/msm-4.19" "$VENDOR_DIR/oplus/kernel/msm-4.19"
          ls -la techpack/display techpack/camera techpack/video 2>/dev/null
          echo "=== verify storm-watch.h resolves via vendor path ==="
          ls -L "$VENDOR_DIR/kernel/msm-4.19/drivers/power/supply/qcom/storm-watch.h" && echo "OK"
          echo "=== verify dsi_display.h resolves via techpack ==="
          ls -L "techpack/display/msm/dsi/dsi_display.h" && echo "OK"

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 kona-perf_defconfig

      - name: Build kernel
        run: |
          set -o pipefail
          # Build only Image.gz, NOT the default target (which builds ALL
          # DTBs including IoT boards like rb5 whose DTS includes are
          # missing) and NOT Image.gz-dtb (which also depends on dtbs).
          #
          # KCFLAGS suppresses clang-12 -Werror failures in OPLUS vendor
          # modules that were written for older GCC/clang and use old-style
          # function definitions (e.g. foo() instead of foo(void)).
          make O=out ARCH=arm64 \
            CC=clang-12 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=clang-12 \
            KCFLAGS="-Wno-error=strict-prototypes -Wno-error=unused-function -Wno-error=unused-variable" \
            -j"$(nproc)" \
            Image.gz 2>&1 | tee build.log | tail -500

      - name: Package AnyKernel3 zip
        run: |
          if   [ -f out/arch/arm64/boot/Image.gz-dtb ]; then cp out/arch/arm64/boot/Image.gz-dtb Dists_ak3/
          elif [ -f out/arch/arm64/boot/Image.gz ];     then cp out/arch/arm64/boot/Image.gz     Dists_ak3/
          elif [ -f out/arch/arm64/boot/Image ];       then cp out/arch/arm64/boot/Image        Dists_ak3/
          else echo "No kernel image found"; exit 1; fi
          cd Dists_ak3 && ./build_zip.sh

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-kona-op8
          path: Dists_ak3/*.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
