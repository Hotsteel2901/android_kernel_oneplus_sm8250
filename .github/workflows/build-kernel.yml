name: Build KSU-Next + SUSFS kernel

# Builds the OnePlus 8 (sm8250 / kona) kernel with KernelSU-Next (manual-hook
# mode) and SUSFS 2.1.0, then packages an AnyKernel3 flashable zip.
#
# The stock OnePlus kernel tree uses symlinks with paths like
# `../../../vendor/oplus/kernel/...` that are designed for the AOSP manifest
# layout where the kernel source lives at <root>/kernel/msm-4.19/ and the
# vendor modules at <root>/vendor/. We replicate that layout by symlinking
# the checked-out repo into /tmp/aosp/kernel/msm-4.19 and placing the vendor
# sources from OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
# at /tmp/aosp/vendor/. All 86 dangling symlinks then resolve to real files.

on:
  push:
    branches: [ oneplus/sm8250_t_13.1_op8 ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'fs/susfs.c'
      - 'fs/read_write.c'
      - 'KernelSU-Next/**'
      - 'drivers/kernelsu'
      - 'Dists_ak3/**'
      - 'arch/arm64/configs/vendor/kona*'
      - 'drivers/Kconfig'
      - 'drivers/Makefile'
      - 'fs/Makefile'
  workflow_dispatch:

env:
  AOSP_ROOT: /tmp/aosp

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev cpio zip unzip rsync python3 \
            llvm clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set up AOSP-like directory layout & fetch vendor modules
        run: |
          set -e
          # The symlinks in this kernel tree expect:
          #   <root>/kernel/msm-4.19/   <- kernel source (this repo)
          #   <root>/vendor/            <- OPLUS + QCOM vendor modules
          mkdir -p "$AOSP_ROOT/kernel"
          ln -s "$GITHUB_WORKSPACE" "$AOSP_ROOT/kernel/msm-4.19"
          # Fetch the official OnePlus open-source vendor modules + devicetree.
          git clone --depth=1 -b oneplus/sm8250_t_13.1_op8 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git \
            /tmp/vendor-modules
          cp -a /tmp/vendor-modules/vendor "$AOSP_ROOT/vendor"
          echo "=== verify: dangling symlinks remaining ==="
          if find "$AOSP_ROOT/kernel/msm-4.19" -xtype l -not -path '*/.git/*' | grep -q .; then
            echo "WARNING: still have dangling symlinks:"
            find "$AOSP_ROOT/kernel/msm-4.19" -xtype l -not -path '*/.git/*'
          else
            echo "none — all symlinks resolved"
          fi
          echo "=== verify: sched_assist/Kconfig ==="
          head -3 "$AOSP_ROOT/kernel/msm-4.19/kernel/sched_assist/Kconfig" || echo "MISSING"

      - name: Make gcc-wrapper.py Python3-compatible
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i 's/^\(\s*\)print \(.*\)$/\1print(\2)/' scripts/gcc-wrapper.py
            sed -i '1s|^#!.*python.*|#!/usr/bin/env python3|' scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configure kernel
        working-directory: /tmp/aosp/kernel/msm-4.19
        run: |
          make O=out ARCH=arm64 kona-perf_defconfig

      - name: Build kernel
        working-directory: /tmp/aosp/kernel/msm-4.19
        run: |
          make O=out ARCH=arm64 \
            CC=clang-12 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=clang-12 \
            -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -500

      - name: Package AnyKernel3 zip
        run: |
          IMG_DIR="$AOSP_ROOT/kernel/msm-4.19/out/arch/arm64/boot"
          if   [ -f "$IMG_DIR/Image.gz-dtb" ]; then cp "$IMG_DIR/Image.gz-dtb" Dists_ak3/
          elif [ -f "$IMG_DIR/Image.gz" ];     then cp "$IMG_DIR/Image.gz"     Dists_ak3/
          elif [ -f "$IMG_DIR/Image" ];       then cp "$IMG_DIR/Image"        Dists_ak3/
          else echo "No kernel image found"; exit 1; fi
          cd Dists_ak3 && ./build_zip.sh

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-kona-op8
          path: Dists_ak3/*.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
